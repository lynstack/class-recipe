name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match the version v$version."
            exit 1
          fi
      - run: pnpm check
      # Trusted publishing needs npm 11.5.1 or newer, which Node.js 24 ships.
      - run: npm --version
      - run: npm publish
